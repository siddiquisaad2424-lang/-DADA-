<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DADA SIMULATOR RACING</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; color: #fff; }

        /* LOADING SCREEN */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
        }
        #loading-screen h1 {
            font-size: 3.5rem; color: #ff1a1a; margin-bottom: 20px;
            text-shadow: 0 0 25px rgba(255, 26, 26, 0.9); font-weight: 900; letter-spacing: 3px;
        }
        .loader-bar { width: 320px; height: 22px; background: #111; border: 2px solid #ff1a1a; border-radius: 12px; overflow: hidden; }
        #loader-fill { width: 0%; height: 100%; background: #ff1a1a; transition: width 0.1s linear; }
        #loader-txt { margin-top: 12px; font-size: 1.2rem; color: #aaa; }

        /* MAIN MENU */
        #main-menu {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #0a0a0a, #1a0000);
            display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 50;
        }
        #main-menu h2 { font-size: 2.5rem; color: #ff1a1a; margin-bottom: 25px; text-shadow: 0 0 15px rgba(255,26,26,0.5); }
        .menu-btn {
            width: 260px; padding: 14px; margin: 8px; background: #ff1a1a; color: #fff;
            border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,26,26,0.4); transition: 0.2s;
        }
        .menu-btn:hover { background: #e60000; transform: scale(1.03); }

        /* GAME SCREEN & LANDSCAPE WRAPPER */
        #game-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            display: none; background: #111; overflow: hidden;
        }
        canvas { display: block; width: 100%; height: 100%; }

        /* HUD OVERLAY */
        #hud {
            position: absolute; top: 15px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 1.1rem; font-weight: bold; z-index: 10; pointer-events: none;
        }
        .hud-box { background: rgba(0,0,0,0.7); padding: 8px 15px; border-radius: 8px; border: 1px solid rgba(255,26,26,0.5); }

        /* CONTROLS */
        .controls {
            position: absolute; bottom: 20px; left: 0; width: 100%;
            display: flex; justify-content: space-between; padding: 0 30px; z-index: 10; pointer-events: none;
        }
        .ctrl-group { display: flex; gap: 15px; pointer-events: auto; }
        .c-btn {
            width: 75px; height: 75px; background: rgba(255,255,255,0.1);
            border: 3px solid rgba(255,26,26,0.8); border-radius: 50%; color: white;
            font-size: 1.8rem; display: flex; justify-content: center; align-items: center; cursor: pointer;
        }
        .c-btn:active { background: rgba(255,26,26,0.6); }

        /* MODALS */
        .modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.9); display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 80;
        }
        .modal h3 { font-size: 2.2rem; color: #ff1a1a; margin-bottom: 20px; }
    </style>
</head>
<body>

    <!-- LOADING -->
    <div id="loading-screen">
        <h1>DADA RACING</h1>
        <div class="loader-bar"><div id="loader-fill"></div></div>
        <div id="loader-txt">Loading... 0%</div>
    </div>

    <!-- MAIN MENU -->
    <div id="main-menu">
        <h2>DADA SIMULATOR RACING</h2>
        <button class="menu-btn" onclick="startGame()">START SIMULATOR</button>
        <button class="menu-btn" onclick="openModal('garage')">GARAGE</button>
        <button class="menu-btn" onclick="openModal('settings')">MAPS & SETTINGS</button>
    </div>

    <!-- GARAGE MODAL -->
    <div id="garage" class="modal">
        <h3>GARAGE</h3>
        <button class="menu-btn" onclick="setCarColor('#ff1a1a')">Red Beast (Selected)</button>
        <button class="menu-btn" onclick="setCarColor('#00bfff')">Blue Storm</button>
        <button class="menu-btn" onclick="closeModal('garage')">BACK</button>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings" class="modal">
        <h3>SELECT MAP</h3>
        <button class="menu-btn" onclick="setMap('city')">City Highway</button>
        <button class="menu-btn" onclick="setMap('jungle')">Jungle Track</button>
        <button class="menu-btn" onclick="closeModal('settings')">BACK</button>
    </div>

    <!-- GAME CONTAINER -->
    <div id="game-container">
        <div id="hud">
            <div class="hud-box">🪙 Coins: <span id="coins">0</span></div>
            <div class="hud-box">🗺️ <span id="map-name">CITY</span></div>
            <div class="hud-box">⚡ <span id="speed">160</span> KM/H</div>
        </div>

        <canvas id="simCanvas"></canvas>

        <div class="controls">
            <div class="ctrl-group">
                <div class="c-btn" ontouchstart="k.left=true" ontouchend="k.left=false" onmousedown="k.left=true" onmouseup="k.left=false">◀</div>
                <div class="c-btn" ontouchstart="k.right=true" ontouchend="k.right=false" onmousedown="k.right=true" onmouseup="k.right=false">▶</div>
            </div>
            <div class="ctrl-group">
                <div class="c-btn" ontouchstart="k.up=true" ontouchend="k.up=false" onmousedown="k.up=true" onmouseup="k.up=false">▲</div>
            </div>
        </div>
    </div>

    <script>
        // Loading animation
        let p = 0, fill = document.getElementById('loader-fill'), txt = document.getElementById('loader-txt');
        let loadInterval = setInterval(() => {
            p += 2; fill.style.width = p + '%'; txt.innerText = `Loading... ${p}%`;
            if(p >= 100) {
                clearInterval(loadInterval);
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('main-menu').style.display = 'flex';
            }
        }, 50);

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        let carColor = '#ff1a1a', currentMap = 'city', score = 0;
        function setCarColor(c) { carColor = c; closeModal('garage'); }
        function setMap(m) { currentMap = m; document.getElementById('map-name').innerText = m.toUpperCase(); closeModal('settings'); }

        // John Cena Audio Theme Synthesizer
        let audioCtx, musicTimer;
        function playCenaMusic() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let notes = [587.33, 587.33, 440, 523.25, 587.33, 880];
                let idx = 0;
                musicTimer = setInterval(() => {
                    if(!audioCtx) return;
                    let osc = audioCtx.createOscillator();
                    let g = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(notes[idx % notes.length], audioCtx.currentTime);
                    g.gain.setValueAtTime(0.06, audioCtx.currentTime);
                    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                    osc.connect(g); g.connect(audioCtx.destination);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                    idx++;
                }, 260);
            } catch(e) {}
        }

        function startGame() {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            initGameEngine();
            playCenaMusic();
        }

        // 3D Perspective Racing Engine
        let canvas, ctx, carX, roadOffset = 0, speed = 8, k = {left:false, right:false, up:false};
        let items = [];

        function initGameEngine() {
            canvas = document.getElementById('simCanvas');
            ctx = canvas.getContext('2d');
            resize();
            window.addEventListener('resize', resize);

            carX = canvas.width / 2;
            for(let i=0; i<5; i++) {
                items.push({ x: canvas.width/2 + (Math.random()*300 - 150), y: i * -200, type: i%2==0 ? 'coin' : 'obs' });
            }

            requestAnimationFrame(loop);
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function loop() {
            update();
            render();
            requestAnimationFrame(loop);
        }

        function update() {
            if(k.left) carX -= 6;
            if(k.right) carX += 6;
            if(k.up) speed = 14; else speed = 8;

            roadOffset += speed;
            if(roadOffset > 40) roadOffset = 0;

            let roadW = Math.min(canvas.width * 0.65, 500);
            let roadL = (canvas.width - roadW) / 2;

            if(carX < roadL + 30) carX = roadL + 30;
            if(carX > roadL + roadW - 30) carX = roadL + roadW - 30;

            items.forEach(item => {
                item.y += speed;
                if(item.y > canvas.height) {
                    item.y = -300;
                    item.x = roadL + 50 + Math.random() * (roadW - 100);
                }
                // Collision
                let dist = Math.hypot(carX - item.x, (canvas.height - 150) - item.y);
                if(dist < 45 && item.type === 'coin') {
                    score += 10;
                    document.getElementById('coins').innerText = score;
                    item.y = -400;
                }
            });

            document.getElementById('speed').innerText = speed * 20;
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Background scenery
            ctx.fillStyle = currentMap === 'city' ? '#0c0c1e' : '#031a03';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 3D Road Perspective Construction
            let roadW = Math.min(canvas.width * 0.65, 500);
            let roadL = (canvas.width - roadW) / 2;

            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(roadL, 0, roadW, canvas.height);

            // Road borders
            ctx.fillStyle = '#ff1a1a';
            ctx.fillRect(roadL - 12, 0, 12, canvas.height);
            ctx.fillRect(roadL + roadW, 0, 12, canvas.height);

            // Center dashes
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 6;
            ctx.setLineDash([30, 30]);
            ctx.lineDashOffset = -roadOffset;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // Items (Coins & Obstacles)
            items.forEach(item => {
                if(item.type === 'coin') {
                    ctx.fillStyle = '#ffcc00';
                    ctx.beginPath(); ctx.arc(item.x, item.y, 16, 0, Math.PI*2); ctx.fill();
                    ctx.strokeStyle = '#b38f00'; ctx.lineWidth = 3; ctx.stroke();
                } else {
                    ctx.fillStyle = '#cc0000';
                    ctx.fillRect(item.x - 25, item.y - 40, 50, 80);
                }
            });

            // Realistic 3D Sports Car Rendering
            let carY = canvas.height - 150;
            ctx.save();
            ctx.translate(carX, carY);
            
            // Car Body
            ctx.fillStyle = carColor;
            ctx.fillRect(-28, -55, 56, 110);

            // Windshields
            ctx.fillStyle = '#111';
            ctx.fillRect(-22, -32, 44, 30);
            ctx.fillRect(-22, 14, 44, 22);

            // Headlights
            ctx.fillStyle = '#ffff99';
            ctx.fillRect(-26, -58, 8, 5);
            ctx.fillRect(18, -58, 8, 5);

            ctx.restore();
        }
    </script>
</body>
</html>
