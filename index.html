<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DADA SIMULATOR RACING PRO</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html {
            width: 100%; height: 100%; background: #000; overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff;
        }

        /* PORTRAIT WARNING TO FORCE LANDSCAPE */
        #rotate-alert {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #050505; z-index: 9999; display: none;
            flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 30px; color: #ff1a1a; font-size: 1.8rem; font-weight: bold;
            text-shadow: 0 0 10px rgba(255,26,26,0.5);
        }
        @media screen and (orientation: portrait) {
            #rotate-alert { display: flex; }
        }

        /* LOADING SYSTEM */
        #loader {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000;
        }
        #loader h1 {
            font-size: 3.8rem; color: #ff1a1a; margin-bottom: 25px;
            letter-spacing: 5px; text-shadow: 0 0 30px rgba(255,26,26,0.8);
        }
        .progress-track { width: 340px; height: 22px; background: #111; border: 2px solid #ff1a1a; border-radius: 12px; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: #ff1a1a; transition: width 0.08s linear; }
        .loader-status { margin-top: 15px; font-size: 1.2rem; color: #aaa; }

        /* MAIN MENU SCREEN */
        #menu {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, #1a0000 0%, #000000 100%);
            display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 500;
        }
        #menu h2 { font-size: 3rem; color: #ff1a1a; margin-bottom: 30px; letter-spacing: 2px; text-shadow: 0 0 20px rgba(255,26,26,0.6); }
        .btn-ui {
            width: 280px; padding: 15px; margin: 10px; background: #ff1a1a; color: #fff;
            border: none; border-radius: 8px; font-size: 1.2rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 5px 20px rgba(255,26,26,0.4); transition: 0.2s;
        }
        .btn-ui:hover { background: #e60000; transform: scale(1.05); }

        /* GAME ENVIRONMENT */
        #game-area {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            display: none; background: #111; overflow: hidden;
        }
        canvas { display: block; width: 100vw; height: 100vh; }

        /* HUD OVERLAY */
        .hud-panel {
            position: absolute; top: 20px; left: 30px; right: 30px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 1.2rem; font-weight: bold; z-index: 20; pointer-events: none;
        }
        .hud-box { background: rgba(0,0,0,0.85); padding: 10px 22px; border-radius: 8px; border: 1px solid rgba(255,26,26,0.5); }

        /* TOUCH CONTROLS */
        .touch-controls {
            position: absolute; bottom: 25px; left: 0; width: 100%;
            display: flex; justify-content: space-between; padding: 0 40px; z-index: 20; pointer-events: none;
        }
        .ctrl-cluster { display: flex; gap: 20px; pointer-events: auto; }
        .pad-btn {
            width: 85px; height: 85px; background: rgba(255,255,255,0.1);
            border: 3px solid rgba(255,26,26,0.9); border-radius: 50%; color: white;
            font-size: 2rem; display: flex; justify-content: center; align-items: center; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .pad-btn:active { background: rgba(255,26,26,0.7); }

        /* MODAL WINDOWS */
        .modal-box {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.92); display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 700;
        }
        .modal-box h3 { font-size: 2.5rem; color: #ff1a1a; margin-bottom: 25px; }
    </style>
</head>
<body>

    <!-- ROTATE NOTIFICATION -->
    <div id="rotate-alert">
        📱 Please rotate your phone to Landscape mode (Movie / Cinematic View) to run the simulation!
    </div>

    <!-- LOADING SCREEN -->
    <div id="loader">
        <h1>DADA RACING ENGINE</h1>
        <div class="progress-track"><div class="progress-fill" id="p-fill"></div></div>
        <div class="loader-status" id="p-text">Loading modules... 0%</div>
    </div>

    <!-- MAIN MENU -->
    <div id="menu">
        <h2>DADA SIMULATOR RACING</h2>
        <button class="btn-ui" onclick="launchGame()">START SIMULATION</button>
        <button class="btn-ui" onclick="toggleModal('garage-modal', true)">GARAGE</button>
        <button class="btn-ui" onclick="toggleModal('settings-modal', true)">MAP SELECTION</button>
    </div>

    <!-- GARAGE MODAL -->
    <div id="garage-modal" class="modal-box">
        <h3>GARAGE CUSTOMIZATION</h3>
        <button class="btn-ui" onclick="selectColor('#ff1a1a')">Red Beast (Equipped)</button>
        <button class="btn-ui" onclick="selectColor('#00bfff')">Blue Phantom</button>
        <button class="btn-ui" onclick="toggleModal('garage-modal', false)">BACK</button>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="modal-box">
        <h3>ENVIRONMENT MAP</h3>
        <button class="btn-ui" onclick="selectMap('city')">City Expressway</button>
        <button class="btn-ui" onclick="selectMap('jungle')">Jungle Highway</button>
        <button class="btn-ui" onclick="toggleModal('settings-modal', false)">BACK</button>
    </div>

    <!-- GAME CONTAINER -->
    <div id="game-area">
        <div class="hud-panel">
            <div class="hud-box">🪙 Coins: <span id="score-val">0</span></div>
            <div class="hud-box">🗺️ <span id="map-disp">CITY</span></div>
            <div class="hud-box">⚡ <span id="speed-disp">180</span> KM/H</div>
        </div>

        <canvas id="engineCanvas"></canvas>

        <div class="touch-controls">
            <div class="ctrl-cluster">
                <div class="pad-btn" ontouchstart="keys.left=true" ontouchend="keys.left=false" onmousedown="keys.left=true" onmouseup="keys.left=false">◀</div>
                <div class="pad-btn" ontouchstart="keys.right=true" ontouchend="keys.right=false" onmousedown="keys.right=true" onmouseup="keys.right=false">▶</div>
            </div>
            <div class="ctrl-cluster">
                <div class="pad-btn" ontouchstart="keys.up=true" ontouchend="keys.up=false" onmousedown="keys.up=true" onmouseup="keys.up=false">▲</div>
            </div>
        </div>
    </div>

    <script>
        // Loading Sequence simulation
        let loadProgress = 0, fillEl = document.getElementById('p-fill'), txtEl = document.getElementById('p-text');
        let loaderTimer = setInterval(() => {
            loadProgress += 3;
            fillEl.style.width = loadProgress + '%';
            txtEl.innerText = `Loading core components... ${loadProgress}%`;
            if(loadProgress >= 100) {
                clearInterval(loaderTimer);
                document.getElementById('loader').style.display = 'none';
                document.getElementById('menu').style.display = 'flex';
            }
        }, 35);

        function toggleModal(id, show) {
            document.getElementById(id).style.display = show ? 'flex' : 'none';
        }

        let vehicleColor = '#ff1a1a', activeMap = 'city', totalCoins = 0;
        function selectColor(c) { vehicleColor = c; toggleModal('garage-modal', false); }
        function selectMap(m) { activeMap = m; document.getElementById('map-disp').innerText = m.toUpperCase(); toggleModal('settings-modal', false); }

        // Embedded Synthesizer Theme
        let audioCtx, musicInterval;
        function playSoundtrack() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let notes = [587.33, 587.33, 440, 523.25, 587.33, 880];
                let index = 0;
                musicInterval = setInterval(() => {
                    if(!audioCtx) return;
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(notes[index % notes.length], audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                    index++;
                }, 260);
            } catch(e) {}
        }

        function launchGame() {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';
            initEngine();
            playSoundtrack();
        }

        // High Performance 3D Racing Renderer Engine
        let canvas, ctx, playerX, trackOffset = 0, currentSpeed = 10, keys = {left:false, right:false, up:false};
        let gameItems = [];

        function initEngine() {
            canvas = document.getElementById('engineCanvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            playerX = window.innerWidth / 2;
            for(let i=0; i<6; i++) {
                gameItems.push({ x: window.innerWidth/2 + (Math.random()*450 - 225), y: i * -250, type: i%2==0 ? 'coin' : 'obstacle' });
            }

            requestAnimationFrame(gameLoop);
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function gameLoop() {
            updateEngine();
            renderEngine();
            requestAnimationFrame(gameLoop);
        }

        function updateEngine() {
            if(keys.left) playerX -= 9;
            if(keys.right) playerX += 9;
            if(keys.up) currentSpeed = 16; else currentSpeed = 10;

            trackOffset += currentSpeed;
            if(trackOffset > 50) trackOffset = 0;

            let roadWidth = Math.min(canvas.width * 0.55, 680);
            let roadLeft = (canvas.width - roadWidth) / 2;

            if(playerX < roadLeft + 40) playerX = roadLeft + 40;
            if(playerX > roadLeft + roadWidth - 40) playerX = roadLeft + roadWidth - 40;

            gameItems.forEach(item => {
                item.y += currentSpeed;
                if(item.y > canvas.height) {
                    item.y = -350;
                    item.x = roadLeft + 60 + Math.random() * (roadWidth - 120);
                }
                let collisionDistance = Math.hypot(playerX - item.x, (canvas.height - 140) - item.y);
                if(collisionDistance < 50 && item.type === 'coin') {
                    totalCoins += 10;
                    document.getElementById('score-val').innerText = totalCoins;
                    item.y = -450;
                }
            });

            document.getElementById('speed-disp').innerText = currentSpeed * 22;
        }

        function renderEngine() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Dynamic Background
            ctx.fillStyle = activeMap === 'city' ? '#080816' : '#021402';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let roadWidth = Math.min(canvas.width * 0.55, 680);
            let roadLeft = (canvas.width - roadWidth) / 2;

            // Road Asphalt
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(roadLeft, 0, roadWidth, canvas.height);

            // Red Side Rails
            ctx.fillStyle = '#ff1a1a';
            ctx.fillRect(roadLeft - 16, 0, 16, canvas.height);
            ctx.fillRect(roadLeft + roadWidth, 0, 16, canvas.height);

            // Center Dashes
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 6;
            ctx.setLineDash([40, 40]);
            ctx.lineDashOffset = -trackOffset;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // Render Coins & Obstacles
            gameItems.forEach(item => {
                if(item.type === 'coin') {
                    ctx.fillStyle = '#ffcc00';
                    ctx.beginPath(); ctx.arc(item.x, item.y, 18, 0, Math.PI*2); ctx.fill();
                    ctx.strokeStyle = '#b38f00'; ctx.lineWidth = 3; ctx.stroke();
                } else {
                    ctx.fillStyle = '#cc0000';
                    ctx.fillRect(item.x - 32, item.y - 48, 64, 96);
                }
            });

            // Player 3D Vehicle Body
            let carYPos = canvas.height - 140;
            ctx.save();
            ctx.translate(playerX, carYPos);
            
            ctx.fillStyle = vehicleColor;
            ctx.fillRect(-32, -60, 64, 120);

            ctx.fillStyle = '#111';
            ctx.fillRect(-25, -35, 50, 35);
            ctx.fillRect(-25, 15, 50, 25);

            ctx.fillStyle = '#ffff99';
            ctx.fillRect(-30, -64, 9, 6);
            ctx.fillRect(21, -64, 9, 6);

            ctx.restore();
        }
    </script>
</body>
</html>
