<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DADA SIMULATOR RACING - University Project</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: #fff;
        }

        /* --- LOADING SCREEN --- */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 1s ease;
        }
        #loading-screen h1 {
            font-size: 4rem;
            color: #ff1a1a;
            margin-bottom: 25px;
            text-shadow: 0 0 25px rgba(255, 26, 26, 0.9), 0 0 50px rgba(255, 26, 26, 0.5);
            letter-spacing: 4px;
            font-weight: 900;
            animation: pulseGlow 1.2s infinite alternate;
            text-align: center;
        }
        @keyframes pulseGlow {
            0% { transform: scale(1); text-shadow: 0 0 15px #ff1a1a; }
            100% { transform: scale(1.05); text-shadow: 0 0 35px #ff1a1a, 0 0 60px #ff0000; }
        }
        .loader-bar-box {
            width: 340px;
            height: 24px;
            background: #111;
            border-radius: 12px;
            border: 2px solid #ff1a1a;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 26, 26, 0.4);
        }
        #loader-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #990000, #ff1a1a);
            transition: width 0.1s linear;
        }
        #loader-percent {
            margin-top: 15px;
            font-size: 1.3rem;
            color: #ccc;
            letter-spacing: 2px;
            font-weight: bold;
        }

        /* --- MAIN MENU --- */
        #main-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #0a0a0a, #1a0000);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }
        #main-menu h2 {
            font-size: 2.8rem;
            color: #ff1a1a;
            margin-bottom: 30px;
            text-shadow: 2px 2px 15px rgba(255, 26, 26, 0.6);
            letter-spacing: 2px;
            text-align: center;
        }
        .menu-btn {
            width: 280px;
            padding: 16px;
            margin: 10px;
            background: #ff1a1a;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 26, 26, 0.5);
            transition: 0.2s;
        }
        .menu-btn:hover {
            background: #e60000;
            transform: scale(1.05);
        }

        /* --- GAME CONTAINER (Full Screen Canvas) --- */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: none;
            overflow: hidden;
            background: #111;
        }
        canvas {
            display: block;
            background: #222;
        }

        /* --- HEAD-UP DISPLAY (SIMULATOR HUD) --- */
        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            z-index: 10;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
            pointer-events: none;
        }
        .hud-item {
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 18px;
            border-radius: 10px;
            border: 1px solid rgba(255,26,26,0.5);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* --- CONTROLS OVERLAY --- */
        .controls-layer {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 35px;
            z-index: 10;
            pointer-events: none;
        }
        .steering-group, .pedal-group {
            display: flex;
            gap: 20px;
            pointer-events: auto;
        }
        .control-btn {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.12);
            border: 3px solid rgba(255, 26, 26, 0.7);
            border-radius: 50%;
            color: white;
            font-size: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(6px);
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .control-btn:active {
            background: rgba(255, 26, 26, 0.7);
            border-color: #fff;
        }

        /* --- GARAGE & SETTINGS MODALS --- */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.92);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 80;
        }
        .modal h3 {
            font-size: 2.5rem;
            color: #ff1a1a;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }
        .car-option-box {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        .car-card {
            width: 120px;
            height: 160px;
            background: #1a1a1a;
            border: 3px solid #333;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .car-card.selected {
            border-color: #ff1a1a;
            background: #330000;
            box-shadow: 0 0 15px rgba(255, 26, 26, 0.5);
        }
        .car-preview {
            width: 55px;
            height: 95px;
            border-radius: 6px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <!-- 1. LOADING SCREEN (Black Background + Red DADA RACING) -->
    <div id="loading-screen">
        <h1>DADA RACING</h1>
        <div class="loader-bar-box">
            <div id="loader-fill"></div>
        </div>
        <div id="loader-percent">Loading... 0%</div>
    </div>

    <!-- 2. MAIN MENU -->
    <div id="main-menu">
        <h2>DADA SIMULATOR RACING</h2>
        <button class="menu-btn" onclick="startTheGame()">START SIMULATOR</button>
        <button class="menu-btn" onclick="openModal('garage-modal')">GARAGE / CARS</button>
        <button class="menu-btn" onclick="openModal('settings-modal')">SETTINGS & MAPS</button>
    </div>

    <!-- 3. GARAGE MODAL -->
    <div id="garage-modal" class="modal">
        <h3>SELECT & EDIT CAR</h3>
        <div class="car-option-box">
            <div class="car-card selected" onclick="selectCar('#ff1a1a', this)">
                <div class="car-preview" style="background: #ff1a1a;"></div>
                <span>Red Beast</span>
            </div>
            <div class="car-card" onclick="selectCar('#00bfff', this)">
                <div class="car-preview" style="background: #00bfff;"></div>
                <span>Blue Storm</span>
            </div>
            <div class="car-card" onclick="selectCar('#00ff66', this)">
                <div class="car-preview" style="background: #00ff66;"></div>
                <span>Neon GT</span>
            </div>
        </div>
        <button class="menu-btn" onclick="closeModal('garage-modal')">BACK</button>
    </div>

    <!-- 4. SETTINGS MODAL & MAPS -->
    <div id="settings-modal" class="modal">
        <h3>SIMULATOR SETTINGS</h3>
        <button class="menu-btn" onclick="setEnvironment('city')">Map: City & Buildings</button>
        <button class="menu-btn" onclick="setEnvironment('jungle')">Map: Jungle & Trees</button>
        <button class="menu-btn" onclick="setEnvironment('village')">Map: Village & Farms</button>
        <button class="menu-btn" onclick="setEnvironment('airport')">Map: Airport Runway</button>
        <button class="menu-btn" onclick="toggleMusic()">Cena Music: <span id="music-status">ON</span></button>
        <button class="menu-btn" onclick="closeModal('settings-modal')">BACK</button>
    </div>

    <!-- 5. GAMEPLAY SCREEN (SIMULATOR HUD + CANVAS) -->
    <div id="game-container">
        <div id="hud">
            <div class="hud-item">🪙 Coins: <span id="coin-count">0</span></div>
            <div class="hud-item">🗺️ <span id="current-env-name">City</span></div>
            <div class="hud-item">⚡ <span id="speed-ometer">140</span> KM/H</div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div class="controls-layer">
            <div class="steering-group">
                <div class="control-btn" ontouchstart="turnLeft(true)" ontouchend="turnLeft(false)" onmousedown="turnLeft(true)" onmouseup="turnLeft(false)">◀</div>
                <div class="control-btn" ontouchstart="turnRight(true)" ontouchend="turnRight(false)" onmousedown="turnRight(true)" onmouseup="turnRight(false)">▶</div>
            </div>
            <div class="pedal-group">
                <div class="control-btn" ontouchstart="accelerate(true)" ontouchend="accelerate(false)" onmousedown="accelerate(true)" onmouseup="accelerate(false)">▲</div>
            </div>
        </div>
    </div>

    <!-- JOHN CENA THEME & SIMULATOR ENGINE SCRIPT -->
    <script>
        // 10 Seconds Loading Sequence (Black screen, Red DADA RACING)
        let loadFill = document.getElementById('loader-fill');
        let loaderPercent = document.getElementById('loader-percent');
        let loadingScreen = document.getElementById('loading-screen');
        let mainMenu = document.getElementById('main-menu');
        
        let progress = 0;
        let loadTimer = setInterval(() => {
            progress += 1;
            loadFill.style.width = progress + '%';
            loaderPercent.innerText = `Loading... ${progress}%`;
            if(progress >= 100) {
                clearInterval(loadTimer);
                loadingScreen.style.opacity = '0';
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                    mainMenu.style.display = 'flex';
                }, 800);
            }
        }, 100);

        // Modal Controls
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // Configurations
        let selectedCarColor = '#ff1a1a';
        let currentEnvironment = 'city';
        let musicEnabled = true;

        function selectCar(color, element) {
            selectedCarColor = color;
            document.querySelectorAll('.car-card').forEach(c => c.classList.remove('selected'));
            element.classList.add('selected');
        }

        function setEnvironment(env) {
            currentEnvironment = env;
            document.getElementById('current-env-name').innerText = env.toUpperCase();
            closeModal('settings-modal');
        }

        function toggleMusic() {
            musicEnabled = !musicEnabled;
            document.getElementById('music-status').innerText = musicEnabled ? 'ON' : 'OFF';
            if(musicEnabled) playJohnCenaTheme();
            else stopJohnCenaTheme();
        }

        // Web Audio API Synthesizer generating John Cena Entry Theme ("Ba-ba-da-daaa!") & Epic Beat 🎧
        let audioCtx, musicInterval;
        function playJohnCenaTheme() {
            if (!musicEnabled) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                // John Cena trumpet fanfare frequency pattern
                let melody = [587.33, 587.33, 440, 523.25, 587.33, 880, 783.99]; 
                let step = 0;
                musicInterval = setInterval(() => {
                    if(!musicEnabled || !audioCtx) return;
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'triangle'; // Gives brass-like trumpet texture
                    osc.frequency.setValueAtTime(melody[step % melody.length], audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.35);
                    step++;
                }, 250);
            } catch(e) { console.log("Audio initialized"); }
        }

        function stopJohnCenaTheme() {
            if(musicInterval) clearInterval(musicInterval);
            if(audioCtx) audioCtx.close();
        }

        function startTheGame() {
            mainMenu.style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            initSimulatorEngine();
            if(musicEnabled) playJohnCenaTheme();
        }

        // --- SIMULATOR 3D-EFFECT CANVAS ENGINE ---
        let canvas, ctx;
        let carX, carY, carAngle = 0, speed = 0, maxSpeed = 10;
        let keys = { left: false, right: false, up: false };
        let coins = [], obstacles = [], totalCoins = 0;
        let roadScroll = 0;

        function initSimulatorEngine() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            carX = canvas.width / 2;
            carY = canvas.height - 180;

            for(let i=0; i<6; i++) {
                coins.push({ x: Math.random() * (canvas.width - 120) + 60, y: -i * 250 - 100 });
                obstacles.push({ x: Math.random() * (canvas.width - 180) + 60, y: -i * 350 - 150 });
            }

            requestAnimationFrame(simulatorLoop);
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function turnLeft(isDown) { keys.left = isDown; }
        function turnRight(isDown) { keys.right = isDown; }
        function accelerate(isDown) { keys.up = isDown; }

        window.addEventListener('keydown', e => {
            if(e.key === 'ArrowLeft') keys.left = true;
            if(e.key === 'ArrowRight') keys.right = true;
            if(e.key === 'ArrowUp') keys.up = true;
        });
        window.addEventListener('keyup', e => {
            if(e.key === 'ArrowLeft') keys.left = false;
            if(e.key === 'ArrowRight') keys.right = false;
            if(e.key === 'ArrowUp') keys.up = false;
        });

        function simulatorLoop() {
            updatePhysics();
            renderSimulatorGraphics();
            requestAnimationFrame(simulatorLoop);
        }

        function updatePhysics() {
            if(keys.up) { if(speed < maxSpeed) speed += 0.12; }
            else { if(speed > 2) speed -= 0.1; }

            if(keys.left) { carAngle -= 0.045; carX -= 3.5; }
            if(keys.right) { carAngle += 0.045; carX += 3.5; }

            if(carX < 50) carX = 50;
            if(carX > canvas.width - 50) carX = canvas.width - 50;

            roadScroll += speed;
            if(roadScroll > 60) roadScroll = 0;

            coins.forEach(coin => {
                coin.y += speed;
                if(coin.y > canvas.height) { coin.y = -250; coin.x = Math.random() * (canvas.width - 120) + 60; }
                let hit = Math.hypot(carX - coin.x, carY - coin.y);
                if(hit < 45) {
                    totalCoins += 10;
                    document.getElementById('coin-count').innerText = totalCoins;
                    coin.y = -350;
                    coin.x = Math.random() * (canvas.width - 120) + 60;
                }
            });

            obstacles.forEach(obs => {
                obs.y += speed * 0.85;
                if(obs.y > canvas.height) { obs.y = -500; obs.x = Math.random() * (canvas.width - 180) + 60; }
            });

            document.getElementById('speed-ometer').innerText = Math.floor(speed * 25);
        }

        function renderSimulatorGraphics() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Environment Background Mapping
            if(currentEnvironment === 'city') {
                ctx.fillStyle = '#0e0e1a'; // City Night Vibe
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#1b1b3a'; // Buildings
                ctx.fillRect(15, 0, 70, canvas.height);
                ctx.fillRect(canvas.width - 85, 0, 70, canvas.height);
            } else if(currentEnvironment === 'jungle') {
                ctx.fillStyle = '#051f05'; // Jungle Green
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#020f02'; // Dense Trees
                ctx.fillRect(0, 0, 90, canvas.height);
                ctx.fillRect(canvas.width - 90, 0, 90, canvas.height);
            } else if(currentEnvironment === 'village') {
                ctx.fillStyle = '#2b2111'; // Village Earth tone
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#1a140a';
                ctx.fillRect(0, 0, 80, canvas.height);
                ctx.fillRect(canvas.width - 80, 0, 80, canvas.height);
            } else {
                ctx.fillStyle = '#3a3a3a'; // Airport Runway concrete
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // Road Layout
            let roadWidth = Math.min(canvas.width * 0.75, 550);
            let roadLeft = (canvas.width - roadWidth) / 2;
            ctx.fillStyle = '#1f1f1f';
            ctx.fillRect(roadLeft, 0, roadWidth, canvas.height);

            // Center Dashed Stripes
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 6;
            ctx.setLineDash([35, 35]);
            ctx.lineDashOffset = -roadScroll * 2.2;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // Coins Rendering
            coins.forEach(coin => {
                ctx.fillStyle = '#ffcc00';
                ctx.beginPath();
                ctx.arc(coin.x, coin.y, 15, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#b38f00';
                ctx.lineWidth = 3;
                ctx.stroke();
            });

// Obstacles / Traffic Cars
            obstacles.forEach(obs => {
                ctx.fillStyle = '#ff3333';
                ctx.fillRect(obs.x - 22, obs.y - 50, 44, 100);
                ctx.fillStyle = '#111';
                ctx.fillRect(obs.x - 16, obs.y - 30, 32, 22);
            });

            // Player's 360-Degree Rotatable Simulator Car
            ctx.save();
            ctx.translate(carX, carY);
            ctx.rotate(carAngle);
            
            // Car Chassis
            ctx.fillStyle = selectedCarColor;
            ctx.fillRect(-24, -50, 48, 100);
            
            // Windshields & Details
            ctx.fillStyle = '#111';
            ctx.fillRect(-18, -30, 36, 25);
            ctx.fillRect(-18, 12, 36, 18);
            
            // Headlights
            ctx.fillStyle = '#ffff99';
            ctx.fillRect(-22, -52, 8, 5);
            ctx.fillRect(14, -52, 8, 5);

            ctx.restore();
        }
    </script>
</body>
</html>
