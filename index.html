<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DADA RACING ULTIMATE</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: Arial, sans-serif; color: #fff; }
        
        #game-ui {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #111; display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        canvas { display: block; background: #1a1a1a; box-shadow: 0 0 30px rgba(255,0,0,0.5); }
        
        .hud {
            position: absolute; top: 15px; left: 30px; right: 30px;
            display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: bold; pointer-events: none;
        }
        .box { background: rgba(0,0,0,0.8); padding: 8px 18px; border-radius: 6px; border: 2px solid #ff1a1a; }

        .controls {
            position: absolute; bottom: 20px; left: 0; width: 100%;
            display: flex; justify-content: space-between; padding: 0 40px; pointer-events: none;
        }
        .cluster { display: flex; gap: 20px; pointer-events: auto; }
        .btn {
            width: 80px; height: 80px; background: rgba(255,255,255,0.15);
            border: 3px solid #ff1a1a; border-radius: 50%; color: white;
            font-size: 2rem; display: flex; justify-content: center; align-items: center; cursor: pointer;
        }
        .btn:active { background: rgba(255,26,26,0.8); }
    </style>
</head>
<body>

    <div id="game-ui">
        <div class="hud">
            <div class="box">🪙 Score: <span id="sc">0</span></div>
            <div class="box">🏎️ DADA RACING</div>
            <div class="box">⚡ <span id="sp">180</span> KM/H</div>
        </div>

        <canvas id="cvs"></canvas>

        <div class="controls">
            <div class="cluster">
                <div class="btn" ontouchstart="ctrl.l=true" ontouchend="ctrl.l=false" onmousedown="ctrl.l=true" onmouseup="ctrl.l=false">◀</div>
                <div class="btn" ontouchstart="ctrl.r=true" ontouchend="ctrl.r=false" onmousedown="ctrl.r=true" onmouseup="ctrl.r=false">▶</div>
            </div>
            <div class="cluster">
                <div class="btn" ontouchstart="ctrl.u=true" ontouchend="ctrl.u=false" onmousedown="ctrl.u=true" onmouseup="ctrl.u=false">▲</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('cvs');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let carX = canvas.width / 2;
        let roadOffset = 0;
        let speed = 12;
        let score = 0;
        let ctrl = { l: false, r: false, u: false };

        let obstacles = [
            { x: canvas.width / 2 - 50, y: -200, type: 'obs' },
            { x: canvas.width / 2 + 50, y: -600, type: 'coin' }
        ];

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Controls movement
            if (ctrl.l) carX -= 10;
            if (ctrl.r) carX += 10;
            speed = ctrl.u ? 18 : 12;

            roadOffset += speed;
            if (roadOffset > 40) roadOffset = 0;

            // Road Dimensions
            let roadW = Math.min(canvas.width * 0.6, 600);
            let roadL = (canvas.width - roadW) / 2;

            if (carX < roadL + 40) carX = roadL + 40;
            if (carX > roadL + roadW - 40) carX = roadL + roadW - 40;

            // Draw Road Background
            ctx.fillStyle = '#111';
            ctx.fillRect(roadL, 0, roadW, canvas.height);

            // Red Borders
            ctx.fillStyle = '#ff1a1a';
            ctx.fillRect(roadL - 12, 0, 12, canvas.height);
            ctx.fillRect(roadL + roadW, 0, 12, canvas.height);

            // Center White Stripes
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 6;
            ctx.setLineDash([35, 35]);
            ctx.lineDashOffset = -roadOffset;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // Obstacles & Coins Logic
            obstacles.forEach(o => {
                o.y += speed;
                if (o.y > canvas.height) {
                    o.y = -300;
                    o.x = roadL + 50 + Math.random() * (roadW - 100);
                    o.type = Math.random() > 0.5 ? 'coin' : 'obs';
                }

                if (o.type === 'coin') {
                    ctx.fillStyle = '#ffcc00';
                    ctx.beginPath(); ctx.arc(o.x, o.y, 16, 0, Math.PI * 2); ctx.fill();
                } else {
                    ctx.fillStyle = '#cc0000';
                    ctx.fillRect(o.x - 30, o.y - 45, 60, 90);
                }

                // Collision
                let dist = Math.hypot(carX - o.x, (canvas.height - 130) - o.y);
                if (dist < 45 && o.type === 'coin') {
                    score += 10;
                    document.getElementById('sc').innerText = score;
                    o.y = -400;
                }
            });

            // Draw Player Car
            let carY = canvas.height - 130;
            ctx.save();
            ctx.translate(carX, carY);
            ctx.fillStyle = '#ff1a1a';
            ctx.fillRect(-30, -55, 60, 110);
            ctx.fillStyle = '#222';
            ctx.fillRect(-22, -30, 44, 30);
            ctx.fillRect(-22, 10, 44, 20);
            ctx.restore();

            document.getElementById('sp').innerText = speed * 15;
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
